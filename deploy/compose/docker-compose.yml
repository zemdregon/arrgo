services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ARRGO_DB_USER:-arrgo}
      POSTGRES_PASSWORD: ${ARRGO_DB_PASSWORD:-arrgo}
      POSTGRES_DB: ${ARRGO_DB_NAME:-arrgo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arrgo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arrgo

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      cluster.name: arrgo-dev
      network.host: 0.0.0.0
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - arrgo

  arrgo-master:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${ARRGO_IMAGE:-arrgo:dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      ARRGO_ROLE: master
      ARRGO_HTTP_ADDR: :8080
      ARRGO_GRPC_ADDR: :9090
      ARRGO_LOG_LEVEL: info
      ARRGO_DATABASE_URL: >-
        postgres://${ARRGO_DB_USER:-arrgo}:${ARRGO_DB_PASSWORD:-arrgo}@postgres:5432/${ARRGO_DB_NAME:-arrgo}?sslmode=disable
      ARRGO_REDIS_ADDR: redis:6379
      ARRGO_OPENSEARCH_URL: http://opensearch:9200
      ARRGO_BOOTSTRAP_ADMIN_TOKEN: ${ARRGO_BOOTSTRAP_ADMIN_TOKEN:-arrgo-admin.devtoken}
      ARRGO_BOOTSTRAP_ADMIN_LABEL: ${ARRGO_BOOTSTRAP_ADMIN_LABEL:-dashboard}
    ports:
      - "8080:8080"
      - "9090:9090"
    networks:
      - arrgo

  arrgo-dashboard:
    build:
      context: ../../web/dashboard
      dockerfile: Dockerfile
    image: ${ARRGO_DASHBOARD_IMAGE:-arrgo-dashboard:dev}
    restart: unless-stopped
    depends_on:
      arrgo-master:
        condition: service_started
    environment:
      NEXT_PUBLIC_ARRGO_API_URL: http://arrgo-master:8080
      NEXT_PUBLIC_ARRGO_API_TOKEN: ${ARRGO_BOOTSTRAP_ADMIN_TOKEN:-arrgo-admin.devtoken}
    ports:
      - "3000:3000"
    networks:
      - arrgo

  arrgo-worker:
    image: ${ARRGO_IMAGE:-arrgo:dev}
    restart: unless-stopped
    depends_on:
      arrgo-master:
        condition: service_started
    environment:
      ARRGO_ROLE: worker
      ARRGO_LOG_LEVEL: info
      ARRGO_MASTER_URL: http://arrgo-master:8080
      ARRGO_REDIS_ADDR: redis:6379
      ARRGO_MASTER_GRPC_ADDR: arrgo-master:9090
      ARRGO_WORKER_POOL: default
      ARRGO_WORKER_VERSION: dev-compose
      ARRGO_WORKER_CAPABILITIES: import,scan
      ARRGO_WORKER_ENDPOINT: http://arrgo-worker:9000
    networks:
      - arrgo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      arrgo-master:
        condition: service_started
    networks:
      - arrgo

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      arrgo-master:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - arrgo

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/config.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/config.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - arrgo

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - arrgo

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  prometheus-data:
  grafana-data:

networks:
  arrgo:
    driver: bridge
