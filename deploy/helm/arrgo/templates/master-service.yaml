apiVersion: v1
kind: Service
metadata:
  name: {{ include "arrgo.master.serviceName" . }}
  labels:
    {{- include "arrgo.master.labels" . | nindent 4 }}
  {{- with .Values.master.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.master.service.type }}
  selector:
    {{- include "arrgo.master.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.master.service.port }}
      targetPort: http
      protocol: TCP
