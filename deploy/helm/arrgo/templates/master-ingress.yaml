{{- if .Values.master.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arrgo.master.fullname" . }}
  labels:
    {{- include "arrgo.master.labels" . | nindent 4 }}
  {{- with .Values.master.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.master.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range .Values.master.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "arrgo.master.serviceName" $ }}
                port:
                  number: {{ $.Values.master.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.master.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
