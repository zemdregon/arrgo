{{- if and .Values.observability.enabled .Values.observability.alertmanager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arrgo.observability.alertmanager.serviceName" . }}
  labels:
    {{- include "arrgo.observability.alertmanager.labels" . | nindent 4 }}
  {{- with .Values.observability.alertmanager.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.observability.alertmanager.service.type }}
  selector:
    {{- include "arrgo.observability.alertmanager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.observability.alertmanager.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
