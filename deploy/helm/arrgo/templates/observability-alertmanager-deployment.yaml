{{- if and .Values.observability.enabled .Values.observability.alertmanager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arrgo.observability.alertmanager.fullname" . }}
  labels:
    {{- include "arrgo.observability.alertmanager.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arrgo.observability.alertmanager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arrgo.observability.alertmanager.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.observability.alertmanager.image.repository }}:{{ .Values.observability.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.observability.alertmanager.image.pullPolicy }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
{{- with .Values.observability.alertmanager.resources }}
          resources:
{{ toYaml . | indent 12 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "arrgo.observability.alertmanager.fullname" . }}-config
{{- end }}
