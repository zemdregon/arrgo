{{- if and .Values.observability.enabled .Values.observability.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arrgo.observability.prometheus.fullname" . }}-config
  labels:
    {{- include "arrgo.observability.prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ default "15s" .Values.observability.prometheus.scrapeInterval }}
      evaluation_interval: {{ default "15s" .Values.observability.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: arrgo-master
        metrics_path: /metrics
        static_configs:
          - targets:
              - '{{ include "arrgo.master.serviceName" . }}:{{ .Values.master.service.port }}'
{{- if and .Values.observability.enabled .Values.observability.otelCollector.enabled }}
      - job_name: otel-collector
        static_configs:
          - targets:
              - '{{ include "arrgo.observability.otelCollector.serviceName" . }}:{{ default 8889 .Values.observability.otelCollector.service.ports.metrics }}'
{{- end }}
{{- end }}
