{{- if and .Values.config.createSecret (not .Values.config.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arrgo.configSecretName" . }}
  labels:
    {{- include "arrgo.labels" . | nindent 4 }}
stringData:
  ARRGO_LOG_LEVEL: {{ default "info" .Values.config.logLevel | quote }}
  {{- $databaseURL := include "arrgo.databaseURL" . }}
  {{- if $databaseURL }}
  ARRGO_DATABASE_URL: {{ $databaseURL | quote }}
  {{- end }}
  {{- $redisAddr := include "arrgo.redisAddr" . }}
  {{- if $redisAddr }}
  ARRGO_REDIS_ADDR: {{ $redisAddr | quote }}
  {{- end }}
  {{- $opensearchURL := include "arrgo.opensearchURL" . }}
  {{- if $opensearchURL }}
  ARRGO_OPENSEARCH_URL: {{ $opensearchURL | quote }}
  {{- end }}
  {{- $masterURL := include "arrgo.masterURL" . }}
  {{- if $masterURL }}
  ARRGO_MASTER_URL: {{ $masterURL | quote }}
  {{- end }}
{{- end }}
