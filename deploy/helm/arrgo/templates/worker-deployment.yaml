apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arrgo.worker.fullname" . }}
  labels:
    {{- include "arrgo.worker.labels" . | nindent 4 }}
spec:
{{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "arrgo.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arrgo.worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.worker.podAnnotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "arrgo.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.worker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ARRGO_ROLE
              value: "worker"
            - name: ARRGO_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_LOG_LEVEL
            {{- $redisAddr := include "arrgo.redisAddr" . }}
            {{- if or $redisAddr .Values.config.existingSecret }}
            - name: ARRGO_REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_REDIS_ADDR
            {{- end }}
            {{- $masterURL := include "arrgo.masterURL" . }}
            {{- if or $masterURL .Values.config.existingSecret }}
            - name: ARRGO_MASTER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_MASTER_URL
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.worker.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
