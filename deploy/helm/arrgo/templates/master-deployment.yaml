apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arrgo.master.fullname" . }}
  labels:
    {{- include "arrgo.master.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.master.replicaCount }}
  selector:
    matchLabels:
      {{- include "arrgo.master.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.master.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "arrgo.master.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.master.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.master.podAnnotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.master.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "arrgo.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: master
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.master.service.port }}
              protocol: TCP
          env:
            - name: ARRGO_ROLE
              value: "master"
            - name: ARRGO_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_LOG_LEVEL
            {{- $databaseURL := include "arrgo.databaseURL" . }}
            {{- if or $databaseURL .Values.config.existingSecret }}
            - name: ARRGO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_DATABASE_URL
            {{- end }}
            {{- $redisAddr := include "arrgo.redisAddr" . }}
            {{- if or $redisAddr .Values.config.existingSecret }}
            - name: ARRGO_REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_REDIS_ADDR
            {{- end }}
            {{- $opensearchURL := include "arrgo.opensearchURL" . }}
            {{- if or $opensearchURL .Values.config.existingSecret }}
            - name: ARRGO_OPENSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arrgo.configSecretName" . }}
                  key: ARRGO_OPENSEARCH_URL
            {{- end }}
            {{- with .Values.master.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.master.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.master.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.master.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.master.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.master.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.master.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.master.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
