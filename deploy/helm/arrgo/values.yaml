# Global image configuration
image:
  repository: ghcr.io/example-org/arrgo
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  createSecret: true
  secretName: ""
  existingSecret: ""
  databaseURL: ""
  redisAddr: ""
  opensearchURL: ""
  masterURL: ""
  logLevel: info

# Connection hints used when the chart generates the secret. Leave blank when
# supplying an existing secret or pre-computed URLs.
database:
  host: ""
  port: 5432
  user: arrgo
  password: ""
  name: arrgo
  sslMode: disable

redis:
  host: ""
  port: 6379
  password: ""

opensearch:
  host: ""
  port: 9200
  protocol: http
  username: ""
  password: ""

master:
  replicaCount: 2
  strategy:
    type: RollingUpdate
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: arrgo.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  livenessProbe: {}
  readinessProbe: {}
  extraEnv: []
  extraEnvFrom: []

worker:
  replicaCount: 3
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  command: []
  args: []
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null

dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/example-org/arrgo-dashboard
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: dashboard.arrgo.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraEnvFrom: []
  command: []
  args: []
  livenessProbe: {}
  readinessProbe: {}

observability:
  enabled: true
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.51.2
      pullPolicy: IfNotPresent
    scrapeInterval: 15s
    retention: 15d
    resources: {}
    service:
      type: ClusterIP
      port: 9090
      annotations: {}
  alertmanager:
    enabled: true
    image:
      repository: prom/alertmanager
      tag: v0.27.0
      pullPolicy: IfNotPresent
    resources: {}
    service:
      type: ClusterIP
      port: 9093
      annotations: {}
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: "10.4.3"
      pullPolicy: IfNotPresent
    adminUser: admin
    adminPassword: grafana
    resources: {}
    service:
      type: ClusterIP
      port: 3000
      annotations: {}
  otelCollector:
    enabled: true
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.98.0
      pullPolicy: IfNotPresent
    resources: {}
    service:
      type: ClusterIP
      ports:
        grpc: 4317
        http: 4318
        metrics: 8889
      annotations: {}

