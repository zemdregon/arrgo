name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt formatting
        run: |
          set -eo pipefail
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt applied:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go test
        run: go test ./...
